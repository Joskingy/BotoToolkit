[project]
name = "amplify-ops"
version = "0.2.0"
description = "Read-only AWS inventory, investigation, and costs with controlled Amplify retries"
readme = "README.md"
authors = [
    { name = "Joskingy" }
]
requires-python = ">=3.15"
dependencies = [
    "boto3>=1.43.114",
    "typer>=0.20",
    "rich>=14",
]

[project.scripts]
bototoolkit = "amplify_ops.cli:app"
amplify-ops = "amplify_ops.cli:app"

[project.optional-dependencies]
tui = [
    "textual>=8,<9",
]

[dependency-groups]
dev = [
    "pytest>=8.4",
    "ruff>=0.14",
    "textual>=8,<9",
]

[tool.uv.build-backend]
module-name = ["amplify_ops", "bototoolkit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py315"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.per-file-target-version]
"scripts/*.py" = "py312"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"
